---

- name: Copy service definition for Jenkins
  ansible.builtin.template:
    src: jenkins.service
    dest: "/etc/systemd/system/jenkins.service"
    mode: 0644
    owner: root
    group: root

- name: Copy executable for Jenkins
  ansible.builtin.template:
    src: jenkins
    dest: "/usr/local/bin/jenkins"
    mode: 0755
    owner: root
    group: root

- name: Start jenkins
  ansible.builtin.service:
    name: Jenkins
    state: started
    enabled: true

- name: Sleep
  ansible.builtin.pause:
    seconds: 10

- name: Install jenkins plugins
  ansible.builtin.shell:
    cmd: docker exec jenkins /bin/bash -c '/usr/local/bin/install-plugins.sh <  /tmp/jenkins/plugins.txt'
  changed_when: true

- name: Setup jenkins plugins
  ansible.builtin.shell:
    cmd: docker exec jenkins /bin/bash -c 'mv /usr/share/jenkins/ref/plugins/*.jpi /var/jenkins_home/plugins/'
  changed_when: true

- name: Restart jenkins
  ansible.builtin.service:
    name: Jenkins
    state: restarted

- name: Ensure Java is installed.
  ansible.builtin.apt:
    name: "{{ java_packages }}"
    state: present
