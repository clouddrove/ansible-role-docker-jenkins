---

- name: Create jenkins dirs
  ansible.builtin.file:
    path: "{{ item|safe|trim }}"
    state: directory
    owner: "{{ jenkins_user }}"
    group: "{{ jenkins_group }}"
    mode: 0755
    recurse: true
  changed_when: false
  with_items:
    - "{{ jenkins_opt_dir }}"
    - "{{ jenkins_config_dir }}"
    - "{{ jenkins_tmp_dir }}"
    - "{{ jenkins_data_dir }}"

- name: Create jenkins log file
  ansible.builtin.template:
    dest: "{{ jenkins_config_dir }}/log.properties"
    owner: "{{ jenkins_user }}"
    group: "{{ jenkins_group }}"
    mode: 0644
    src: log.properties

- name: Copy jenkins plugins file
  ansible.builtin.template:
    dest: "{{ jenkins_tmp_dir }}/plugins.txt"
    owner: "{{ jenkins_user }}"
    group: "{{ jenkins_group }}"
    mode: 0644
    src: plugins/plugins.txt

- name: Create jenkins caddy file
  ansible.builtin.template:
    dest: "{{ jenkins_config_dir }}/Caddyfile"
    owner: "{{ jenkins_user }}"
    group: "{{ jenkins_user }}"
    mode: 0644
    src: Caddyfile
  when: caddy
